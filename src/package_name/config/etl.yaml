# ETL domain settings.
#
# Medallion layer names and streaming checkpoint locations.

# Schema holding the medallion tables used by the sample medallion pipeline.
scratch_schema: sample_medallion

# Bronze layer: raw events table.
bronze_table: bronze_events

# Silver layer: cleaned and deduplicated events table.
silver_table: silver_events

# Gold layer: customer totals aggregate table.
gold_table: gold_customer_totals

# Auto Loader checkpoint path template ({catalog}, {scratch_schema}, {table}).
checkpoint_template: /Volumes/{catalog}/{scratch_schema}/checkpoints/{table}
