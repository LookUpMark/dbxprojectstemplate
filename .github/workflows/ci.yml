# CI for the template: lint and dependency-free tests on every push/PR.
# Integration and e2e tests that need a live Databricks workspace run locally
# (they require databricks configure), not in CI.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # Dev group brings ruff and pytest; none of it contacts a workspace.
      - name: Sync dependencies
        run: uv sync --frozen --dev

      - name: Ruff check
        run: uv run ruff check src tests

      - name: Ruff format check
        run: uv run ruff format --check src tests

      - name: Unit tests (no Spark, no workspace auth)
        run: uv run pytest tests/unit -q
